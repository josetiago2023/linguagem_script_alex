<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Menor nota</title>
</head>
<body>
    <script>
        let menornota;

        for (let i = 1; i <= 5; i++) {
            let nota = Number(prompt("Digite uma nota: "));

            if (i == 1 || nota < menornota) {
                menornota = nota;
            }
        }

        console.log("Menor nota: " + menornota);
    </script>
