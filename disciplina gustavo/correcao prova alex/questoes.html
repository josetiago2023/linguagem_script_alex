<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite o preço do produto:
    <input type="text" id = "Preco">
    <button onclick="calcular()">click</button>
    <p id = "resultado"></p>

   <p>-------------------------------------------------------------------------------------
      <br>  Questao 02</p> 
      Digite um numero:
      <input type="number" id = "N1">
      <button onclick="q2()">click</button>
      <p id = "resultado2"></p> 
    
    <p>------------------------------------------------------------------------------------ <br> 
    Questao 03:<p>
        Digite nota 1:
        <input type="number" id = "Nota1">
        Digite Nota 2:
        <input type="number" id  = "Nota2">
        Digite Nota 3:
        <input type="number" id = "Nota3">
        <button onclick = "q3()">click</button>
        <p id = resultado3></p>
    
    <script>
        function calcular(){
        let preco = Number(document.getElementById("Preco").value);
        let desconto = preco * 0.2;
        let valorfinal = preco - desconto;
        document.getElementById("resultado").innerHTML = valorfinal;

        }
        
        
        function q2(){
            let n1 = Number(document.getElementById("N1").value);
            let teste2;
            if(n1 > 0){
                if(n1 % 2 == 0){
                    teste2 = "positivo e par";
                }else{
                    teste2 = "numero positivo e impar";
                }
            }else if(n1 == 0){
                teste2 = "é neutro";
            }else{
                teste2 = "numero negativo";
            }document.getElementById("resultado2").innerHTML = teste2;
        }

        function q3(){
            let nota1 = Number(document.getElementById("Nota1").value);
            let nota2 = Number(document.getElementById("Nota2").value);
            let teste3;
            let media = (nota1 + nota2) / 2;
            if(media > 70){
                teste3 = `Aprovado Media: ${media}`;

            }else{
                teste3 = `Reprovado Media:${media}`;
            }document.getElementById("resultado3").innerHTML = teste3;
        }


    </script>
</body>
</html>
