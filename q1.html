<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>aplique um desconto de 10% do valor do produto/p> <br><br>
         Digite o valor do produto<input type="text" id = "produto">
       Digite o valor do desconto <input type="text" id = "desconto">
       
        <p>id = "result"</p>
        <button onclick="calculo()">calcular</button>
        
        <script>
           
        

        function calculo(){
            let valorproduto = Number(document.getElementById("produto").value);
            let valordesconto = Number(document.getElementById("desconto").value);
            let resultado = valorproduto - valordesconto;
            document.getElementById("result").innerHTML = "resultado:" + resultado; 
            


            
        }


        </script>
        



</body>
</html>
